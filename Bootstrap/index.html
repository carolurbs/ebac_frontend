<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
</head>
<body class="bg-dark text-light">
    <div class="container text-center">
        <div class="row align-items-center">
            <div class="col">
                <h1> Fale Conosco</h1>
            </div>
            <form>
                <label class="form-label" for="name">Seu nome</label>
                <input class="form-control form-control-sm border border-light  bg-dark text-light" type="text" id="name" placeholder="Digite seu nome" required>
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control form-control-sm border border-light bg-dark text-light" type="email" id="email" placeholder="Digite seu E-mail" required>
                <label class="form-label" for="telephone">Seu telefone</label>
                <input class="form-control form-control-sm border border-light bg-dark text-light" type="tel" id="telephone" placeholder="Digite seu telefone" required>
                <button class="border border-light bg-dark text-light" type="submit">Enviar</button>

            </form>

        </div>   
    </div>
</body>
</html>
