<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolador de Dados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="@@CSS_ADDRESS">
</head>
<body>
    <main>
        <h1>Rolador de dados</h1>
        <form id="form-sorteador">
            <div>
                <label for="max-number">Lados do dado</label>
                <input type="number" id="max-number" required min="2" value="2" step="2">
            </div>
            <button type="submit">Rolar dado</button>
        </form>
        <div class="result">Você rolou: <span id="diceResult"></span></div>
    </main>
    <script src="@@JS_ADDRESS"></script>
</body>
</html>
