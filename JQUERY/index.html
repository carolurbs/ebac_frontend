<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="content">
        <h1>Formulário de Contato</h1>
        <form>
            <label for="name">Nome</label>
            <br>
            <input type="text" required id="name" placeholder="Digite seu nome">
            <br>
            <label for="email">E-mail</label>
            <br>
            <input type="email" required id="email" placeholder="Digite seu E-mail">
            <br>
            <label for="telephone">Telefone</label>
            <br>
            <input type="tel" required id="telephone" placeholder="Digite seu telefone">
            <br>
            <label for="cpf">CPF</label>
            <br>
            <input type="text" required id="cpf" placeholder="Digite seu CPF">
            <br>
            <label for="cep">CEP</label>
            <br>
            <input type="text" required id="cep" placeholder="Digite seu CEP">
            <br>
            <label for="endereço">Endereço Completo</label>
            <br>
            <input type="text" required id="endereço" placeholder="Digite seu endereço">
            <br>
            <button type="submit">Enviar</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./plugins/jquery.mask.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
